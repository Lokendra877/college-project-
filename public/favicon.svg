<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="smartmic-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Mic Capsule -->
  <rect x="23" y="10" width="18" height="26" rx="9" fill="url(#smartmic-grad)" />
  <line x1="23" y1="23" x2="41" y2="23" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Mic Stand Arc -->
  <path d="M16 24 C 16 38, 48 38, 48 24" stroke="url(#smartmic-grad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
  
  <!-- Stem -->
  <line x1="32" y1="38" x2="32" y2="48" stroke="url(#smartmic-grad)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Base -->
  <line x1="22" y1="48" x2="42" y2="48" stroke="url(#smartmic-grad)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Sound Waves Left -->
  <path d="M10 20 C 7 25, 7 29, 10 34" stroke="url(#smartmic-grad)" stroke-width="3" stroke-linecap="round" fill="none" />
  
  <!-- Sound Waves Right -->
  <path d="M54 20 C 57 25, 57 29, 54 34" stroke="url(#smartmic-grad)" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
